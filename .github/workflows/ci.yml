name: ci
# Also started by workflow_dispatch: PRs opened with GITHUB_TOKEN do not trigger pull_request
# runs, so the worker and the supervisor start CI on the branch directly. The check runs land on
# the branch's head commit, which is what the PR shows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm test
